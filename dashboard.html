<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lobster Gang Office - Dashboard</title>
    <link rel="stylesheet" href="/public/styles/base.css">
    <link rel="stylesheet" href="/public/styles/components.css">
    <link rel="stylesheet" href="/public/styles/dashboard.css">
</head>
<body class="dashboard-page">
    <div class="dashboard-shell">
        <div class="dashboard-header">
            <div>
                <div class="dashboard-title">🦞 Lobster Gang 戰情板</div>
                <div class="dashboard-sub">正式數據視角：看狀態、成本、趨勢與事件</div>
            </div>
            <div class="nav-links">
                <a class="nav-link" href="/">進入辦公室</a>
                <a class="nav-link active" href="/dashboard">查看戰情板</a>
            </div>
        </div>

        <div class="kpi-grid">
            <div class="kpi-card"><div class="kpi-label">今日 Sessions</div><div class="kpi-value" id="kpi-sessions">0</div></div>
            <div class="kpi-card"><div class="kpi-label">今日 Tokens</div><div class="kpi-value" id="kpi-tokens">0</div></div>
            <div class="kpi-card"><div class="kpi-label">今日 Cost</div><div class="kpi-value" id="kpi-cost">$0.0000</div></div>
            <div class="kpi-card"><div class="kpi-label">活躍 Agent</div><div class="kpi-value" id="kpi-active">0</div></div>
            <div class="kpi-card"><div class="kpi-label">今日 Tasks</div><div class="kpi-value" id="kpi-tasks">0</div></div>
            <div class="kpi-card"><div class="kpi-label">Alerts</div><div class="kpi-value" id="kpi-alerts">0</div></div>
        </div>

        <div class="content-grid">
            <div>
                <div class="panel-card mb-16">
                    <h3>Agent 總覽</h3>
                    <div class="table-wrap">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>名稱</th>
                                    <th>Sessions</th>
                                    <th>Tokens</th>
                                    <th>Tasks</th>
                                    <th>Cost</th>
                                </tr>
                            </thead>
                            <tbody id="agent-table-body"></tbody>
                        </table>
                    </div>
                </div>
                <div class="panel-card">
                    <h3>7 日趨勢</h3>
                    <div class="trend-placeholder" id="trend-placeholder">Phase 1：先接上真實趨勢資料與圖表元件</div>
                </div>
            </div>
            <div>
                <div class="panel-card mb-16">
                    <h3>Mood / Alert</h3>
                    <div id="mood-list" class="event-list"></div>
                </div>
                <div class="panel-card">
                    <h3>事件時間軸</h3>
                    <div id="dashboard-events" class="event-list"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="/public/scripts/api.js"></script>
    <script src="/public/scripts/formatters.js"></script>
    <script src="/public/scripts/chart-renderer.js"></script>
    <script src="/public/scripts/dashboard-page.js"></script>
</body>
</html>
