<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lobster Gang Office - Office</title>
    <link rel="stylesheet" href="/public/styles/base.css">
    <link rel="stylesheet" href="/public/styles/components.css">
    <link rel="stylesheet" href="/public/styles/office.css">
    <link rel="stylesheet" href="/public/styles/phase3.css">
</head>
<body class="office-page">
    <div id="header">
        <h1>🦞 Lobster Gang Office</h1>
        <div class="nav-links">
            <a class="nav-link active" href="/">進入辦公室</a>
            <a class="nav-link" href="/dashboard">查看戰情板</a>
            <span class="chip">Nexora 🦞｜雙軌模式</span>
        </div>
    </div>

    <div id="game-container">
        <div class="top-summary">
            <div class="summary-card">
                <div class="summary-label">在線成員</div>
                <div class="summary-value" id="summary-online">0</div>
            </div>
            <div class="summary-card">
                <div class="summary-label">今日事件</div>
                <div class="summary-value" id="summary-events">0</div>
            </div>
            <div class="summary-card">
                <div class="summary-label">最新公告</div>
                <div class="summary-value" id="summary-announcement">待命中</div>
            </div>
        </div>

        <canvas id="game-canvas"></canvas>
        <div id="speech-bubble"></div>
        <div id="alert-banner" class="alert-banner"></div>
        <div id="achievement-toast" class="achievement-toast"></div>
        <div id="hotspot-hint" class="hotspot-hint"></div>

        <div class="panel">
            <div class="panel-header">🧭 事件時間軸</div>
            <div class="timeline-filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="command">Commands</button>
                <button class="filter-btn" data-filter="sync">Sync</button>
                <button class="filter-btn" data-filter="mood">Mood</button>
                <button class="filter-btn" data-filter="system">System</button>
            </div>
            <div class="timeline-list" id="timeline-list"></div>
        </div>

        <div class="drawer" id="agent-drawer">
            <h3 id="drawer-name">選擇一位成員</h3>
            <div class="muted" id="drawer-role">點擊場景中的角色查看詳情</div>
            <div class="drawer-grid">
                <div class="stat-box"><div class="label">Presence</div><div class="value" id="drawer-presence">-</div></div>
                <div class="stat-box"><div class="label">Activity</div><div class="value" id="drawer-activity">-</div></div>
                <div class="stat-box"><div class="label">今日 Tokens</div><div class="value" id="drawer-tokens">0</div></div>
                <div class="stat-box"><div class="label">今日 Tasks</div><div class="value" id="drawer-tasks">0</div></div>
            </div>
            <div class="muted">最新心情</div>
            <div id="drawer-mood">待命中</div>
            <div class="mt-16 row space-between">
                <span class="chip" id="drawer-last-update">最後更新：--</span>
                <a class="btn-primary" id="drawer-link" href="/dashboard">查看戰情板</a>
            </div>
        </div>

        <div id="status-bar">
            成員在線: <span id="online-count">0</span> | 模式: 虛擬辦公室
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/public/scripts/api.js"></script>
    <script src="/public/scripts/state.js"></script>
    <script src="/public/scripts/formatters.js"></script>
    <script src="/public/scripts/socket.js"></script>
    <script src="/public/scripts/office-ui.js"></script>
    <script src="/public/scripts/office-events.js"></script>
    <script src="/public/scripts/office-hotspots.js"></script>
    <script src="/public/scripts/office-focus.js"></script>
    <script src="/public/scripts/office-scene.js"></script>
    <script src="/public/scripts/timeline-model.js"></script>
    <script src="/public/scripts/phase3-effects.js"></script>
    <script src="main.js"></script>
</body>
</html>
