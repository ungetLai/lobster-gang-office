<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lobster Gang Office - Agent Detail</title>
  <link rel="stylesheet" href="/public/styles/base.css">
  <link rel="stylesheet" href="/public/styles/components.css">
  <link rel="stylesheet" href="/public/styles/dashboard.css">
</head>
<body class="dashboard-page">
  <div class="dashboard-shell">
    <div class="dashboard-header">
      <div>
        <div class="dashboard-title" id="agent-name">Agent</div>
        <div class="dashboard-sub" id="agent-role">detail</div>
      </div>
      <div class="nav-links">
        <a class="nav-link" href="/">進入辦公室</a>
        <a class="nav-link" href="/dashboard">查看戰情板</a>
      </div>
    </div>
    <div class="kpi-grid">
      <div class="kpi-card"><div class="kpi-label">Sessions</div><div class="kpi-value" id="agent-sessions">0</div></div>
      <div class="kpi-card"><div class="kpi-label">Tokens</div><div class="kpi-value" id="agent-tokens">0</div></div>
      <div class="kpi-card"><div class="kpi-label">Tasks</div><div class="kpi-value" id="agent-tasks">0</div></div>
      <div class="kpi-card"><div class="kpi-label">Cost</div><div class="kpi-value" id="agent-cost">$0.0000</div></div>
    </div>
    <div class="content-grid">
      <div>
        <div class="panel-card mb-16"><h3>Agent 趨勢</h3><div id="agent-trend" class="trend-placeholder"></div></div>
      </div>
      <div>
        <div class="panel-card"><h3>即時狀態</h3><p>狀態：<span id="agent-status">idle</span></p><p>心情：<span id="agent-mood">待命中</span></p><p>上線時長：<span id="agent-uptime">--</span></p></div>
      </div>
    </div>
  </div>
  <script src="/public/scripts/api.js"></script>
  <script src="/public/scripts/formatters.js"></script>
  <script src="/public/scripts/chart-renderer.js"></script>
  <script src="/public/scripts/agent-detail-page.js"></script>
</body>
</html>
